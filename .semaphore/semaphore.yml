version: v1.0
name: Module 5 - Deployment (g3)
agent:
  machine:
    type: f1-standard-2
    os_image: ubuntu2404
fail_fast:
  stop:
    when: 'true'
auto_cancel:
  running:
    when: branch != 'main'
  queued:
    when: branch = 'main'
blocks:
  - name: Build and Push Image
    dependencies: []
    task:
      secrets:
        - name: dockerhubDeki
      jobs:
        - name: Docker build & push
          commands:
            - checkout
            - cd 1-deployment
            - echo "$DOCKERHUB_PASSWORD" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
            - 'docker build -t $DOCKERHUB_USERNAME/my-flask-image:latest .'
            - 'docker push $DOCKERHUB_USERNAME/my-flask-image:latest'
  - name: Deploy to Kubernetes
    dependencies:
      - Build and Push Image
    task:
      secrets:
        - name: kubeconfig
      prologue:
        commands:
          - checkout
          - cd 1-deployment
          - mkdir -p ~/.kube
          - echo "$KUBECONFIG_BASE64" | base64 -d > ~/.kube/config
          - chmod 600 ~/.kube/config
          - kubectl create namespace g3 || true
          - kubectl config set-context --current --namespace=g3
      jobs:
        - name: Apply manifests
          commands:
            - kubectl apply -f deployment.yml
            - kubectl apply -f service.yml
            - kubectl rollout status deployment/flask-app
  - name: Verify
    dependencies:
      - Deploy to Kubernetes
    task:
      secrets:
        - name: kubeconfig
      jobs:
        - name: Get service info
          commands:
            - mkdir -p ~/.kube
            - echo "$KUBECONFIG_BASE64" | base64 -d > ~/.kube/config
            - chmod 600 ~/.kube/config
            - kubectl config set-context --current --namespace=g3
            - kubectl get svc flask-app
