version: v1.0
name: Module 5 - Blue/Green (g3)

agent:
  machine:
    type: f1-standard-2
    os_image: ubuntu2404

fail_fast:
  stop:
    when: "true"

auto_cancel:
  running:
    when: "branch != 'main'"
  queued:
    when: "branch = 'main'"

blocks:
  - name: Build and Push Image
    dependencies: []
    task:
      secrets:
        - name: dockerhubDeki
      jobs:
        - name: Docker build & push
          commands:
            - checkout
            - cd 2-blue-green-deployment
            - echo "$DOCKERHUB_PASSWORD" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
            - docker build -t $DOCKERHUB_USERNAME/my-flask-image:latest .
            - docker push $DOCKERHUB_USERNAME/my-flask-image:latest

  - name: Deploy Blue
    dependencies: ["Build and Push Image"]
    task:
      secrets:
        - name: kubeconfig
      prologue:
        commands:
          - checkout
          - cd 2-blue-green-deployment
          - kubectl create namespace g3 || true
          - kubectl config set-context --current --namespace=g3
      jobs:
        - name: Apply blue manifests
          commands:
            - kubectl apply -f deployment-blue.yml
            - kubectl apply -f service-blue.yml
            - kubectl rollout status deployment/flask-app-blue

  - name: Verify Blue
    dependencies: ["Deploy Blue"]
    task:
      secrets:
        - name: kubeconfig
      jobs:
        - name: Get service info
          commands:
            - kubectl config set-context --current --namespace=g3
            - kubectl get svc flask-app

promotions:
  - name: Promote to Green
    pipeline_file: promote-green.yml
